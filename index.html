<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Glassmorphism Toggle UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">    
</head>
<body class="sleep-mode min-h-screen flex flex-col items-center justify-between p-6 overflow-hidden">

    <header class="w-full max-w-md flex justify-between items-center text-white/70 pt-4">
        <div class="flex items-center gap-2 text-sm font-medium tracking-wide">
            <i class="fa-solid fa-wand-magic-sparkles text-purple-400" id="header-icon"></i>
            <span id="header-title" class="text-white/90">Glassmorphism UI</span>
        </div>
        <div class="bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-xs text-white/80 border border-white/10">
            Interactive Dynamic Toggle
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center w-full my-auto">
        
        <!-- Ambient Backlight Reflection -->
        <div id="ambient-glow" class="absolute w-[320px] h-[200px] rounded-full blur-[90px] opacity-60 transition-all duration-700 pointer-events-none bg-purple-600/40"></div>

        <!-- The Glassmorphic Toggle Pill Button -->
        <div id="toggle-pill" class="glass-pill is-sleep sleep-glow select-none" role="button" aria-label="Toggle Mode" tabindex="0">
            
            <!-- Sleep Label (Left side when knob is on right) -->
            <span class="pill-label sleep-label">Sleep</span>

            <!-- Glass Knob Sphere -->
            <div class="glass-knob" id="glass-knob">
                <i id="knob-icon" class="fa-solid fa-moon knob-icon"></i>
            </div>

            <!-- Work Label (Right side when knob is on left) -->
            <span class="pill-label work-label">Work</span>
        </div>

        <!-- Mode Indicator Text Below -->
        <div class="mt-12 text-center">
            <h2 id="status-title" class="text-2xl font-bold text-white tracking-wide transition-all duration-500">Sleep Mode</h2>
            <p id="status-desc" class="text-sm text-white/60 mt-1 transition-all duration-500">Soft indigo theme with glossy backdrop blur</p>
        </div>
    </main>

    <footer class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/15 rounded-2xl p-4 text-white/90 shadow-2xl transition-all">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="status-badge" class="w-3 h-3 rounded-full bg-purple-500 shadow-[0_0_10px_#a855f7]"></div>
                <span id="footer-text" class="text-xs font-semibold uppercase tracking-wider text-white/80">Active State: Sleep</span>
            </div>
            <button id="quick-toggle" class="bg-white/15 hover:bg-white/25 border border-white/20 active:scale-95 transition-all text-xs px-3 py-1.5 rounded-lg font-medium text-white flex items-center gap-1.5">
                <i class="fa-solid fa-repeat"></i> Switch
            </button>
        </div>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
